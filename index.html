    const s = String(g ?? "").trim();

        const res = await api[kind](request);

                logBank('Kredit CASA (hasil buyback)', { rekening: bankCustomer.casaAccountNo, nominal: credit, reffBiller: request.reffBiller });
            }
            await onDone(extractInfo(res, request));
            return;
        }
        if (isUncertain(res)) {
            setPendingTx({ kind, request, jenis, label, debit, credit, onDone, onFail, stage: 'uncertain', code: res.responseCode, desc: res.responseDesc });
            return;
        }
        if (debit) {
            setCasaBalance(b => b + debit);
            logBank('Reversal debit CASA', { rekening: bankCustomer.casaAccountNo, nominal: debit, reffBiller: request.reffBiller, alasan: errText(res) });
        }
